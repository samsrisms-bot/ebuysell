<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIM IVR CRM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-view" class="view">
    <div class="login-box">
      <h1>SIM IVR CRM</h1>
      <p>Enter the admin token to continue.</p>
      <input id="admin-token-input" type="password" placeholder="Admin token" autocomplete="off" />
      <button id="login-btn">Log in</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="app-view" class="view hidden">
    <header>
      <h1>SIM IVR CRM</h1>
      <button id="logout-btn">Log out</button>
    </header>

    <nav>
      <button class="tab-btn active" data-tab="campaigns">Campaigns</button>
      <button class="tab-btn" data-tab="leads">Leads</button>
      <button class="tab-btn" data-tab="events">Event feed</button>
    </nav>

    <section id="tab-campaigns" class="tab">
      <h2>New campaign</h2>
      <div class="row">
        <input id="new-campaign-name" placeholder="Campaign name" />
        <button id="create-campaign-btn">Create</button>
      </div>
      <h2>Campaigns</h2>
      <table>
        <thead><tr><th>Name</th><th>Status</th><th>Contacts</th><th>Leads</th><th>Campaign ID (for app / CSV import)</th></tr></thead>
        <tbody id="campaigns-body"></tbody>
      </table>
    </section>

    <section id="tab-leads" class="tab hidden">
      <h2>Leads</h2>
      <div class="row">
        <label for="lead-status-filter">Filter:</label>
        <select id="lead-status-filter">
          <option value="">All</option>
          <option value="NEW">New</option>
          <option value="CONTACTED">Contacted</option>
          <option value="CLOSED">Closed</option>
        </select>
      </div>
      <table>
        <thead><tr><th>Number</th><th>Name</th><th>Campaign</th><th>Received</th><th>Status</th></tr></thead>
        <tbody id="leads-body"></tbody>
      </table>
    </section>

    <section id="tab-events" class="tab hidden">
      <h2>Live event feed <span class="hint">(auto-refreshes every 5s)</span></h2>
      <table>
        <thead><tr><th>Received</th><th>Event</th><th>Direction</th><th>Number</th><th>SIM</th><th>Flow</th><th>Digits</th><th>Duration</th></tr></thead>
        <tbody id="events-body"></tbody>
      </table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
